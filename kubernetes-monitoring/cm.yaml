---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx_conf
data:
  nginx_config: |
      server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Everything is a 404
        location / {
                root /var/www/localhost/htdocs/;
                index index.html;
        }

        # You may need this to prevent return 404 recursion.
        location = /404.html {
                internal;
        }
        location = /basic_status {
                 stub_status;
        }
      }
